<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PHP Version Checker</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 280px;
    margin: 0;
    padding: 14px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: Canvas;
    color: CanvasText;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.ok { background: #2e7d32; }
  .dot.vulnerable { background: #c62828; }
  .dot.unknown { background: #757575; }
  .status-label { font-weight: 600; text-transform: uppercase; font-size: 12px; }
  .reason { margin: 0 0 10px; word-break: break-word; }
  .url { font-size: 11px; opacity: .65; word-break: break-all; margin-bottom: 10px; }
  .note { font-size: 11px; opacity: .75; border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); padding-top: 8px; margin-top: 4px; }
  button {
    font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
    background: transparent; color: inherit; cursor: pointer; width: 100%;
  }
  button:hover { background: color-mix(in srgb, CanvasText 8%, transparent); }
</style>
</head>
<body>
  <h1>PHP Version Checker</h1>
  <div class="status-row">
    <span class="dot unknown" id="dot"></span>
    <span class="status-label" id="statusLabel">checking…</span>
  </div>
  <p class="reason" id="reason">Looking at this tab's response headers…</p>
  <p class="url" id="url"></p>
  <button id="recheck">Reload &amp; re-check</button>
  <p class="note">
    Based only on the <code>Server</code> / <code>X-Powered-By</code> response
    headers (same heuristic as
    <a href="https://github.com/openai/php2shell-checker" target="_blank" rel="noopener">openai/php2shell-checker</a>).
    Hidden or missing headers read as UNKNOWN &mdash; that is not proof the
    site is patched.
  </p>
  <script src="popup.js"></script>
</body>
</html>
